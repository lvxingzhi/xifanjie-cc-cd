<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>大秘境副本技能速查 · 制作者: 西番芥</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%2322C55E'/><rect width='64' height='64' fill='none' stroke='%2315803D' stroke-width='4'/><text x='50%25' y='56%25' font-family='PingFang SC,Microsoft Yahei,sans-serif' font-size='34' font-weight='800' fill='%23fff' text-anchor='middle' dominant-baseline='middle'>西</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ===== 色板（与 index.html 一致） ===== */
  :root {
    --primary: #FDBCB4;
    --primary-dark: #F5A69D;
    --primary-soft: #FFF0EE;
    --secondary: #ADD8E6;
    --secondary-dark: #8BC4D6;
    --cta: #22C55E;
    --cta-dark: #16A34A;
    --accent-purple: #E6E6FA;
    --accent-mint: #98FF98;
    --bg: #FFFFFF;
    --bg-cream: #FFF9F5;
    --text: #2D3748;
    --text-muted: #64748B;
    --border: #E2E8F0;
    /* clay 设计令牌（Neo-brutalism 风格） */
    --br: 3px solid var(--text);
    --br-thin: 2px solid var(--text);
    --sh-xs: 2px 2px 0 var(--text);
    --sh-sm: 4px 4px 0 var(--text);
    --sh-md: 6px 6px 0 var(--text);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 13px/1.6 "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", PingFang SC, "Microsoft Yahei", sans-serif;
    background-color: var(--bg-cream);
    color: var(--text);
    padding: 96px 12px 40px;
    min-height: 100vh;
  }
  /* Halftone 网点背景纹理 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image: radial-gradient(rgba(45, 55, 72, .6) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: .05;
  }
  a { color: var(--text); text-decoration: none; }

  /* ===== clay 卡片 ===== */
  .clay-card {
    background: var(--bg);
    border-radius: 24px;
    border: var(--br);
    box-shadow: var(--sh-md), inset 0 -4px rgba(0, 0, 0, .08);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: .7rem 1.4rem; font-weight: 800; border-radius: 14px;
    border: var(--br); box-shadow: var(--sh-sm);
    transition: all .15s ease; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { box-shadow: var(--sh-xs); transform: translate(2px, 2px); text-decoration: none; }
  .btn:active { box-shadow: 0 0 0 var(--text); transform: translate(4px, 4px); }
  .btn-primary { background: var(--cta); color: #fff; }
  .btn-primary:hover { background: var(--cta-dark); }
  .btn-secondary { background: var(--secondary); color: var(--text); }

  /* ===== 悬浮导航 ===== */
  .topnav { position: fixed; top: 1rem; left: 1rem; right: 1rem; z-index: 50; }
  .topnav-inner {
    max-width: 1152px; margin: 0 auto;
    background: var(--bg); border-radius: 24px;
    border: var(--br);
    box-shadow: var(--sh-md), inset 0 -4px rgba(0, 0, 0, .08);
    padding: 10px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .topnav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none !important; }
  .topnav-logo {
    width: 40px; height: 40px; border-radius: 14px; flex: 0 0 auto;
    background: var(--primary); border: var(--br);
    box-shadow: var(--sh-sm);
    display: grid; place-items: center;
    font-size: 19px; font-weight: 900; color: var(--text); line-height: 1;
  }
  .topnav-name {
    font-family: "Fredoka", "PingFang SC", sans-serif;
    font-size: 18px; font-weight: 700; color: var(--text); white-space: nowrap; line-height: 1.2;
  }
  .topnav-name .acc { color: #D9745F; }
  .topnav-links { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .topnav-links a {
    padding: 7px 12px; border-radius: 10px; font-size: 14px; font-weight: 700;
    color: var(--text-muted); text-decoration: none; white-space: nowrap; transition: all .15s;
  }
  .topnav-links a:hover { color: var(--text); background: var(--primary-soft); text-decoration: none; }
  .topnav-right { display: flex; align-items: center; gap: 10px; }
  .topnav-right .btn { padding: 8px 16px; font-size: 13px; }
  .topnav-burger {
    display: none; width: 40px; height: 40px; border-radius: 14px; flex: 0 0 auto;
    background: var(--secondary); border: var(--br);
    box-shadow: var(--sh-sm);
    cursor: pointer; align-items: center; justify-content: center; color: var(--text);
  }
  .topnav-burger svg { width: 20px; height: 20px; }
  .topnav-menu {
    display: none; flex-direction: column; gap: 6px;
    max-width: 1152px; margin: 8px auto 0;
    background: var(--bg); border: var(--br); border-radius: 20px;
    box-shadow: var(--sh-md), inset 0 -4px rgba(0, 0, 0, .08);
    padding: 12px;
  }
  .topnav-menu.open { display: flex; }
  .topnav-menu a {
    display: block; padding: 11px 14px; border-radius: 12px;
    font-size: 14px; font-weight: 700; color: var(--text);
    text-decoration: none; transition: background .15s;
  }
  .topnav-menu a:hover { background: var(--primary-soft); }
  .topnav-menu .btn { justify-content: center; margin-top: 4px; }

  /* ===== 语言切换 ===== */
  .lang-switch {
    display: inline-flex; gap: 4px;
    background: var(--bg-cream); border: var(--br); border-radius: 999px; padding: 3px;
  }
  .lang-switch button {
    background: transparent; color: var(--text-muted); border: none;
    padding: 5px 12px; font-size: 13px; font-weight: 700; cursor: pointer; line-height: 1.3;
    border-radius: 999px;
  }
  .lang-switch button.active {
    background: var(--primary); color: var(--text);
    box-shadow: 2px 2px 0 var(--primary-dark);
  }

  /* ===== 工具栏 ===== */
  .toolbar {
    max-width: 860px; margin: 0 auto 20px;
    padding: 12px 14px;
    display: flex; flex-wrap: wrap; gap: 9px; align-items: center;
  }
  .toolbar select, .toolbar button {
    background: var(--bg); color: var(--text); border: var(--br);
    border-radius: 12px; padding: 7px 12px; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: border-color .15s;
  }
  .toolbar select:hover, .toolbar button:hover { border-color: var(--primary); }
  .toolbar .share-btn {
    background: var(--cta); color: #fff;
    box-shadow: 3px 3px 0 var(--cta-dark);
  }
  .toolbar .share-btn:hover { background: var(--cta-dark); box-shadow: 1px 1px 0 var(--cta-dark); transform: translate(2px, 2px); }
  .toolbar .hint { color: var(--text-muted); font-size: 11.5px; font-weight: 600; margin-left: auto; }

  /* ===== 卡片容器 ===== */
  .cards { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  /* ===== 单张卡片 ===== */
  .card {
    overflow: hidden;
    page-break-inside: avoid;
  }

  /* ===== 卡片头部 ===== */
  .card-header {
    padding: 16px 20px;
    border-bottom: 3px solid var(--text);
    display: flex; align-items: center; gap: 12px;
    position: relative; z-index: 1;
    background: var(--primary-soft);
  }
  .card-title-wrap { flex: 1; min-width: 0; }
  .card-title-row { display: flex; align-items: center; gap: 10px; }
  .card-title {
    display: inline-block;
    font-size: 22px; font-weight: 700; line-height: 1.2;
    font-family: "Fredoka", "PingFang SC", sans-serif;
    letter-spacing: .5px;
    color: #fff;
    background: #DC2626;
    border: var(--br);
    border-radius: 14px;
    box-shadow: var(--sh-sm);
    padding: 6px 16px;
    transform: rotate(-0.5deg);
  }
  .card-title-en { margin-top: 6px; font-size: 11.5px; color: var(--text-muted); font-weight: 600; }
  .card-season {
    background: var(--secondary); color: var(--text);
    padding: 5px 13px; border-radius: 999px;
    font-size: 11px; font-weight: 800; letter-spacing: .5px; white-space: nowrap;
    border: var(--br);
    box-shadow: 3px 3px 0 rgba(45, 55, 72, .6);
    transform: rotate(-1deg);
  }
  .boss-count {
    background: #F59E0B; color: #fff;
    padding: 5px 12px; border-radius: 999px;
    font-size: 11px; font-weight: 900; letter-spacing: .5px; white-space: nowrap;
    border: var(--br);
    box-shadow: 3px 3px 0 rgba(45, 55, 72, .6);
    transform: rotate(1.5deg);
  }

  /* ===== 怪物分组 ===== */
  .mob-list { padding: 14px 16px; position: relative; z-index: 1; }
  .mob-block { margin-bottom: 12px; }
  .mob-block:last-child { margin-bottom: 0; }

  .mob-header {
    padding: 8px 12px;
    border-bottom: 2px solid var(--border);
    border-left: 5px solid var(--primary);
    background: #FDF8F3;
    border-radius: 0 12px 0 0;
    display: flex; align-items: center; gap: 7px;
  }
  .mob-block.is-boss .mob-header { border-left-color: var(--cta); background: var(--primary-soft); }
  .boss-badge {
    margin-left: auto;
    background: #8B5CF6; color: #fff; font-weight: 900; font-size: 10px;
    padding: 2px 10px; border-radius: 999px; letter-spacing: 1px;
    border: var(--br-thin); box-shadow: 2px 2px 0 rgba(45, 55, 72, .25);
  }
  .mob-name-zh { font-size: 13.5px; font-weight: 800; color: var(--text); }
  .mob-block.is-boss .mob-name-zh { color: #7C3AED; }
  .mob-name-en { font-size: 10.5px; color: var(--text-muted); font-weight: 600; margin-left: 3px; }

  /* ===== 技能列表 ===== */
  .spell-row {
    padding: 7px 12px;
    border-bottom: 1px dashed var(--border);
  }
  .spell-row:last-child { border-bottom: none; }

  .spell-name { font-size: 13px; font-weight: 800; color: #C75F4A; }
  .spell-desc-inline { font-size: 12px; color: var(--text-muted); margin-left: 6px; }
  .spell-tags {
    display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 6px;
    vertical-align: middle;
  }
  .spell-meta { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

  /* ===== 彩色小标签 ===== */
  .tag {
    display: inline-block; padding: 1px 9px; border-radius: 999px;
    font-size: 10px; font-weight: 800; line-height: 1.7; white-space: nowrap;
    border: var(--br-thin); box-shadow: 2px 2px 0 rgba(45, 55, 72, .25);
  }
  .tag-int { background: var(--cta); color: #fff; padding: 2px 10px; font-size: 10.5px; }
  .tag-mag { background: #DDEAF7; color: #1D5E9E; }
  .tag-enrage { background: #FDE9D5; color: #B4530A; }
  .tag-bleed { background: #FADFE1; color: #8E1E36; }
  .tag-poison { background: #F5F1D8; color: #6E7F14; }
  .tag-disease { background: #E4E8D8; color: #4E5F1E; }
  .tag-curse { background: #E9E5F5; color: #533E8F; }

  /* ===== 底部 ===== */
  .card-footer {
    background: var(--primary-soft);
    border-top: 3px solid var(--text);
    padding: 9px 18px; display: flex; align-items: center; gap: 12px;
    position: relative; z-index: 1;
  }
  .footer-brand {
    font-size: 11.5px; font-weight: 800; color: #C75F4A;
    background: var(--primary-soft); border: var(--br-thin);
    border-radius: 999px; padding: 2px 12px;
  }
  .footer-social { margin-left: auto; text-align: right; font-size: 9.5px; color: var(--text-muted); line-height: 1.4; font-weight: 600; }
  .footer-social .hl { color: #C75F4A; font-weight: 800; }

  /* ===== 分享模式 ===== */
  body.share-mode .toolbar { display: none; }
  body.share-mode .topnav { display: none; }
  body.share-mode { padding: 8px 8px 24px; }
  body.share-mode .cards { gap: 14px; }
  body.share-mode .card-header { padding: 11px 14px; }
  body.share-mode .card-title { font-size: 18px; }
  body.share-mode .mob-list { padding: 8px 10px; }
  body.share-mode .spell-row { padding: 5px 9px; }
  body.share-mode .card { box-shadow: var(--sh-sm), inset 0 -4px rgba(0, 0, 0, .08); }

  /* ===== 空状态 ===== */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; font-weight: 600; }

  /* ===== 响应式 ===== */
  @media (max-width: 720px) {
    .topnav-links { display: none; }
    .topnav-right { margin-left: auto; }
    .topnav-burger { display: inline-flex; }
    body { padding: 96px 6px 30px; }
    .card-title { font-size: 18px; }
    .mob-name-zh { font-size: 12.5px; }
    .spell-name { font-size: 12px; }
    .spell-desc-inline { font-size: 11px; }
    .toolbar .hint { width: 100%; margin-left: 0; }
  }
  @media (max-width: 600px) {
    .topnav-name .acc { display: none; }
    .topnav-inner { padding: 8px 12px; gap: 8px; }
    .topnav-right .btn { padding: 7px 12px; }
  }
</style>
</head>
<body>

<nav class="topnav" aria-label="主导航">
  <div class="topnav-inner">
    <a href="index.html" class="topnav-brand" aria-label="返回速查表">
      <span class="topnav-logo">西</span>
      <span class="topnav-name">西番芥的<span class="acc">秘境工具箱</span></span>
    </a>
    <div class="topnav-links">
      <a href="https://space.bilibili.com/346688237" target="_blank" rel="noopener">B站主页</a>
    </div>
    <div class="topnav-right">
      <a href="index.html" class="btn btn-primary">返回速查表</a>
    </div>
    <button class="topnav-burger" id="topnavBurger" aria-label="打开菜单" aria-expanded="false">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
  </div>
  <div class="topnav-menu" id="topnavMenu">
    <a href="https://space.bilibili.com/346688237" target="_blank" rel="noopener">B站主页</a>
    <a href="index.html" class="btn btn-primary">返回速查表</a>
  </div>
</nav>

<div class="toolbar clay-card">
  <div class="lang-switch" id="langSwitch">
    <button type="button" data-lang="zh" class="active">中文</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <select id="season"><option value="" data-i18n="allSeasons">全部赛季</option></select>
  <select id="dungeon"><option value="" data-i18n="allDungeons">全部副本</option></select>
  <button type="button" class="share-btn" id="shareBtn">分享模式</button>
  <span class="hint" data-i18n="hint">长截图分享</span>
</div>

<div class="cards" id="cards"></div>

<script>
const BILIBILI_ID = "346688237";

const ESC = { "\u0026": "\u0026amp;", "\u003c": "\u0026lt;", "\u003e": "\u0026gt;", "\u0022": "\u0026quot;", "\u0027": "\u0026#39;" };
const escapeHtml = (s) => String(s == null ? "" : s).replace(/[\u0026\u003c\u003e\u0022\u0027]/g, (c) => ESC[c]);

// ===== 中英双语（与 index.html 同步，localStorage 记忆） =====
const I18N = {
  zh: {
    allSeasons: "全部赛季", allDungeons: "全部副本",
    share: "分享模式", shareExit: "退出分享模式", hint: "长截图分享",
    tagInt: "可打断", tagMagic: "魔法", tagEnrage: "激怒", tagBleed: "流血",
    tagPoison: "中毒", tagDisease: "疾病", tagCurse: "诅咒",
    empty: "暂无数据",

  },
  en: {
    allSeasons: "All Seasons", allDungeons: "All Dungeons",
    share: "Share Mode", shareExit: "Exit Share Mode", hint: "Long screenshot share",
    tagInt: "Int", tagMagic: "Magic", tagEnrage: "Enrage", tagBleed: "Bleed",
    tagPoison: "Poison", tagDisease: "Disease", tagCurse: "Curse",
    empty: "No data",

  },
};
const t = (k) => (I18N[lang] && I18N[lang][k]) || I18N.zh[k] || k;

// 副本下拉显示名（选中值始终为中文名，仅显示随语言切换）
function dungeonLabel(d) {
  return lang === "en" ? (d.en || d.name) : d.name;
}

let allRows = [], allDungeons = [], allSeasons = [];
let lang = localStorage.getItem("mss_lang") === "en" ? "en" : "zh";

async function load() {
  const res = await fetch("data.json", { cache: "no-cache" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();

  allSeasons = Object.keys(data.seasons || {});
  allDungeons = data.dungeons || [];
  allRows = data.rows || [];

  const sSel = document.getElementById("season");
  allSeasons.forEach((s) => {
    const opt = document.createElement("option");
    opt.value = s; opt.textContent = s;
    sSel.appendChild(opt);
  });

  fillDungeonSelect();

  render();
}

function fillDungeonSelect() {
  const dSel = document.getElementById("dungeon");
  const prev = dSel.value;
  dSel.innerHTML = '<option value="">' + escapeHtml(t("allDungeons")) + '</option>';
  allDungeons.forEach((d) => {
    const opt = document.createElement("option");
    opt.value = d.name;
    opt.textContent = dungeonLabel(d);
    dSel.appendChild(opt);
  });
  if (prev && [...dSel.options].some((o) => o.value === prev)) dSel.value = prev;
}

function buildSpellTags(r) {
  const allDebuffsTrue = r.isEnrage && r.isBleed && r.isPoison && r.isDisease && r.isCurse;
  const tags = [];
  if (r.interruptible) tags.push('<span class="tag tag-int">' + t("tagInt") + '</span>');
  if (r.isMagic) tags.push('<span class="tag tag-mag">' + t("tagMagic") + '</span>');
  if (!allDebuffsTrue) {
    if (r.isEnrage) tags.push('<span class="tag tag-enrage">' + t("tagEnrage") + '</span>');
    if (r.isBleed) tags.push('<span class="tag tag-bleed">' + t("tagBleed") + '</span>');
    if (r.isPoison) tags.push('<span class="tag tag-poison">' + t("tagPoison") + '</span>');
    if (r.isDisease) tags.push('<span class="tag tag-disease">' + t("tagDisease") + '</span>');
    if (r.isCurse) tags.push('<span class="tag tag-curse">' + t("tagCurse") + '</span>');
  }
  return tags.join("");
}

function render() {
  const season = document.getElementById("season").value;
  const dungeon = document.getElementById("dungeon").value;
  const container = document.getElementById("cards");

  let rows = allRows;
  if (season) rows = rows.filter((r) => r.season === season);
  if (dungeon) rows = rows.filter((r) => r.dungeonZh === dungeon);

  const dedupSeen = new Set();
  rows = rows.filter((r) => {
    const tagSig = [r.interruptible, r.isMagic, r.isEnrage, r.isBleed, r.isPoison, r.isDisease, r.isCurse]
      .map((b) => (b ? 1 : 0)).join("");
    const key = [
      r.dungeonZh || "",
      r.npcId || r.mobZh || "",
      (r.spellName || "").trim(),
      (r.spellNameEn || "").trim(),
      (r.description || "").trim(),
      (r.descriptionEn || "").trim(),
      tagSig,
    ].join("||");
    if (dedupSeen.has(key)) return false;
    dedupSeen.add(key);
    return true;
  });

  const groups = {};
  for (const r of rows) {
    const key = r.dungeonZh || "未知";
    if (!groups[key]) groups[key] = { dungeonZh: key, dungeonEn: r.dungeonEn, season: r.season, rows: [] };
    groups[key].rows.push(r);
  }

  const dungeonNames = Object.keys(groups);
  if (!dungeonNames.length) {
    container.innerHTML = '<div class="empty">' + escapeHtml(t("empty")) + '</div>';
    return;
  }

  container.innerHTML = dungeonNames.map((name) => {
    const g = groups[name];

    const mobs = {}; const mobOrder = [];
    for (const r of g.rows) {
      const k = (r.npcId || r.mobZh) + "|" + r.mobZh;
      if (!mobs[k]) {
        mobs[k] = { mobZh: r.mobZh, mobEn: r.mobEn, isBoss: r.isBoss, spells: [] };
        mobOrder.push(k);
      }
      mobs[k].spells.push(r);
    }
    mobOrder.sort((a, b) => (mobs[b].isBoss ? 1 : 0) - (mobs[a].isBoss ? 1 : 0));
    const bossCount = mobOrder.filter((k) => mobs[k].isBoss).length;

    const mobsHtml = mobOrder.map((k) => {
      const m = mobs[k];
      const en = lang === "en";
      const mobMain = en ? (m.mobEn || m.mobZh) : m.mobZh;
      const mobSub = en ? m.mobZh : (m.mobEn || "");
      const spellsHtml = m.spells.map((r) => {
        const tags = buildSpellTags(r);
        const desc = en ? (r.descriptionEn || r.description) : r.description;
        const spellName = en ? (r.spellNameEn || r.spellName) : r.spellName;
        const descHtml = desc
          ? '<span class="spell-desc-inline">' + escapeHtml(desc) + '</span>'
          : '';
        const tagsHtml = tags ? '<span class="spell-tags">' + tags + '</span>' : '';

        return '<div class="spell-row">' +
          '<div>' +
            '<span class="spell-name">' + escapeHtml(spellName) + '</span>' +
            descHtml +
            tagsHtml +
          '</div>' +
          '</div>';
      }).join("");

      return '<div class="mob-block' + (m.isBoss ? ' is-boss' : '') + '">' +
        '<div class="mob-header">' +
          '<span class="mob-name-zh">' + escapeHtml(mobMain) + '</span>' +
          '<span class="mob-name-en">' + escapeHtml(mobSub) + '</span>' +
          (m.isBoss ? '<span class="boss-badge">BOSS</span>' : '') +
        '</div>' +
        '<div class="spell-list">' + spellsHtml + '</div>' +
        '</div>';
    }).join("");

    return '<div class="card clay-card">' +
      '<div class="card-header">' +
        '<div class="card-title-wrap">' +
          '<div class="card-title-row">' +
            '<div class="card-title">' + escapeHtml(lang === "en" ? (g.dungeonEn || g.dungeonZh) : g.dungeonZh) + '</div>' +
            (bossCount > 0 ? '<span class="boss-count">BOSS ×' + bossCount + '</span>' : '') +
          '</div>' +
          '<div class="card-title-en">' + escapeHtml(lang === "en" ? g.dungeonZh : (g.dungeonEn || '')) + '</div>' +
        '</div>' +
        '<span class="card-season">' + escapeHtml(g.season) + '</span>' +
      '</div>' +
      '<div class="mob-list">' + mobsHtml + '</div>' +
      '<div class="card-footer">' +
        '<span class="footer-brand">制作者: 西番芥</span>' +
        '<span class="footer-social">' +
          'B站 <span class="hl">西番芥</span> · space.bilibili.com/' + BILIBILI_ID +
        '</span>' +
      '</div>' +
      '</div>';
  }).join("");
}

document.getElementById("season").addEventListener("change", render);
document.getElementById("dungeon").addEventListener("change", render);
document.getElementById("shareBtn").addEventListener("click", () => {
  document.body.classList.toggle("share-mode");
  const btn = document.getElementById("shareBtn");
  btn.textContent = document.body.classList.contains("share-mode") ? t("shareExit") : t("share");
});

// 中英切换
function applyStaticLang() {
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("#langSwitch button").forEach((b) => {
    b.classList.toggle("active", b.getAttribute("data-lang") === lang);
  });
  const shareBtn = document.getElementById("shareBtn");
  shareBtn.textContent = document.body.classList.contains("share-mode") ? t("shareExit") : t("share");
}
function applyLang() {
  applyStaticLang();
  fillDungeonSelect();
  render();
}
document.querySelectorAll("#langSwitch button").forEach((btn) => {
  btn.addEventListener("click", () => {
    lang = btn.getAttribute("data-lang") === "en" ? "en" : "zh";
    localStorage.setItem("mss_lang", lang);
    applyLang();
  });
});

// 数据加载前先应用记忆的语言（静态文案），加载完成后 applyLang 再整表切换
applyStaticLang();
load();
// 移动端导航菜单
(function () {
  const burger = document.getElementById("topnavBurger"), menu = document.getElementById("topnavMenu");
  if (!burger || !menu) return;
  burger.addEventListener("click", () => {
    const open = menu.classList.toggle("open");
    burger.setAttribute("aria-expanded", open ? "true" : "false");
  });
  menu.querySelectorAll("a").forEach((a) =>
    a.addEventListener("click", () => {
      menu.classList.remove("open");
      burger.setAttribute("aria-expanded", "false");
    })
  );
})();
</script>
</body>
</html>
