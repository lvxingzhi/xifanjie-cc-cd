<style>
  /* ===== 色板（参考 LearnHub / educational-platform demo） ===== */
  :root {
    --primary: #FDBCB4;       /* 珊瑚粉（小面积点缀） */
    --primary-dark: #F5A69D;
    --primary-soft: #FFF0EE;
    --secondary: #ADD8E6;     /* 天蓝 */
    --secondary-dark: #8BC4D6;
    --cta: #22C55E;           /* 绿：按钮 / 打断 */
    --cta-dark: #16A34A;
    --accent-purple: #E6E6FA; /* 淡紫 */
    --accent-mint: #98FF98;   /* 薄荷 */
    --bg: #FFFFFF;            /* 卡片底 */
    --bg-cream: #FFF9F5;      /* 页面底（奶油） */
    --text: #2D3748;
    --text-muted: #64748B;
    --border: #E2E8F0;
    /* clay 设计令牌（Neo-brutalism 风格） */
    --br: 3px solid var(--text);
    --br-thin: 2px solid var(--text);
    --sh-xs: 2px 2px 0 var(--text);
    --sh-sm: 4px 4px 0 var(--text);
    --sh-md: 6px 6px 0 var(--text);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-cream); color: var(--text); }
  body {
    font: 14px/1.6 "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", PingFang SC, "Microsoft Yahei", sans-serif;
    min-height: 100vh;
  }
  /* Halftone 网点背景纹理 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image: radial-gradient(rgba(45, 55, 72, .6) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: .05;
  }
  a { color: var(--text); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ===== clay 卡片（双向硬阴影，参考 demo） ===== */
  .clay-card {
    background: var(--bg);
    border-radius: 24px;
    border: var(--br);
    box-shadow: var(--sh-md), inset 0 -4px rgba(0, 0, 0, .08);
  }
  .clay-hover { transition: box-shadow .15s ease, transform .15s ease; }
  .clay-hover:hover { box-shadow: var(--sh-sm), inset 0 -4px rgba(0, 0, 0, .08); transform: translate(2px, 2px); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: .8rem 1.6rem; font-weight: 800; border-radius: 14px;
    border: var(--br); box-shadow: var(--sh-sm);
    transition: all .15s ease; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { box-shadow: var(--sh-xs); transform: translate(2px, 2px); text-decoration: none; }
  .btn:active { box-shadow: 0 0 0 var(--text); transform: translate(4px, 4px); }
  .btn-primary { background: var(--cta); color: #fff; }
  .btn-primary:hover { background: var(--cta-dark); }
  .btn-secondary { background: var(--secondary); color: var(--text); }
  .btn-secondary:hover { background: var(--secondary-dark); }

  /* ===== 悬浮导航 ===== */
  html { scroll-behavior: smooth; }
  #toolbar { scroll-margin-top: 110px; }
  .topnav { position: fixed; top: 1rem; left: 1rem; right: 1rem; z-index: 50; }
  .topnav-inner {
    max-width: 1152px; margin: 0 auto;
    background: var(--bg); border-radius: 24px;
    border: var(--br);
    box-shadow: var(--sh-md), inset 0 -4px rgba(0, 0, 0, .08);
    padding: 10px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .topnav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none !important; }
  .topnav-logo {
    width: 40px; height: 40px; border-radius: 14px; flex: 0 0 auto;
    background: var(--primary); border: var(--br);
    box-shadow: var(--sh-sm);
    display: grid; place-items: center;
    font-size: 19px; font-weight: 900; color: var(--text); line-height: 1;
  }
  .topnav-name {
    font-family: "Fredoka", "PingFang SC", sans-serif;
    font-size: 18px; font-weight: 700; color: var(--text); white-space: nowrap; line-height: 1.2;
  }
  .topnav-name .acc { color: #D9745F; }
  .topnav-links { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .topnav-links a {
    padding: 7px 12px; border-radius: 10px; font-size: 14px; font-weight: 700;
    color: var(--text-muted); text-decoration: none; white-space: nowrap; transition: all .15s;
  }
  .topnav-links a:hover { color: var(--text); background: var(--primary-soft); text-decoration: none; }
  .topnav-right { display: flex; align-items: center; gap: 10px; }
  .topnav-right .btn { padding: 8px 16px; font-size: 13px; }
  .topnav-burger {
    display: none; width: 40px; height: 40px; border-radius: 14px; flex: 0 0 auto;
    background: var(--secondary); border: var(--br);
    box-shadow: var(--sh-sm);
    cursor: pointer; align-items: center; justify-content: center; color: var(--text);
  }
  .topnav-burger svg { width: 20px; height: 20px; }
  .topnav-menu {
    display: none; flex-direction: column; gap: 6px;
    max-width: 1152px; margin: 8px auto 0;
    background: var(--bg); border: var(--br); border-radius: 20px;
    box-shadow: var(--sh-md), inset 0 -4px rgba(0, 0, 0, .08);
    padding: 12px;
  }
  .topnav-menu.open { display: flex; }
  .topnav-menu a {
    display: block; padding: 11px 14px; border-radius: 12px;
    font-size: 14px; font-weight: 700; color: var(--text);
    text-decoration: none; transition: background .15s;
  }
  .topnav-menu a:hover { background: var(--primary-soft); }
  .topnav-menu .btn { justify-content: center; margin-top: 4px; }

  /* ===== 语言切换（胶囊） ===== */
  .lang-switch {
    display: inline-flex; gap: 4px;
    background: var(--bg-cream); border: var(--br); border-radius: 999px; padding: 3px;
  }
  .lang-switch button {
    background: transparent; color: var(--text-muted); border: none;
    padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer; line-height: 1.2;
    border-radius: 999px; transition: all .15s;
  }
  .lang-switch button.active {
    background: var(--primary); color: var(--text);
    box-shadow: 2px 2px 0 var(--primary-dark);
  }

  /* ===== Hero 区 ===== */
  .hero { position: relative; overflow: hidden; padding: 132px 24px 56px; }
  .hero-inner {
    position: relative; z-index: 1; max-width: 1152px; margin: 0 auto;
    display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center;
  }
  /* 有机 blob 小装饰（小面积彩色点缀） */
  .blob {
    position: absolute; pointer-events: none; z-index: 0;
    border: var(--br);
    animation: floaty 8s ease-in-out infinite alternate;
  }
  .blob-1 { width: 34px; height: 34px; background: var(--accent-mint); top: 96px; left: 6%; border-radius: 60% 40% 30% 70%/60% 30% 70% 40%; }
  .blob-2 { width: 26px; height: 26px; background: var(--accent-purple); top: 180px; right: 8%; border-radius: 40% 60% 70% 30%/50% 60% 40% 50%; animation-delay: 1.6s; }
  .blob-3 { width: 22px; height: 22px; background: var(--secondary); bottom: 60px; left: 46%; border-radius: 55% 45% 60% 40%/45% 55% 45% 55%; animation-delay: 3s; }
  @keyframes floaty {
    from { transform: translateY(-5px) rotate(-4deg); }
    to   { transform: translateY(7px) rotate(5deg); }
  }

  .hero h1 {
    font-family: "Fredoka", "PingFang SC", sans-serif;
    font-size: 44px; font-weight: 700; line-height: 1.15; margin: 0 0 24px;
    color: var(--text);
  }
  .hero h1 .acc { color: #D9745F; }
  .hero-btns { display: flex; flex-wrap: wrap; gap: 14px; }

  /* ===== 统计卡 2x2（大数字 + 标签） ===== */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .stat { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .stat .num {
    font-family: "Fredoka", "Nunito", sans-serif;
    font-size: 32px; font-weight: 600; color: var(--text); line-height: 1.1;
  }
  .stat .num.ok { color: var(--cta-dark); }
  .stat .label { font-size: 12.5px; color: var(--text-muted); font-weight: 700; }

  /* ===== 主内容 ===== */
  .container { max-width: 1152px; margin: 0 auto; padding: 0 24px 72px; }

  /* 工具栏 */
  .toolbar {
    padding: 14px 16px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .toolbar select, .toolbar input[type=text] {
    background: var(--bg); border: var(--br); color: var(--text);
    padding: 8px 13px; border-radius: 12px; font-size: 13px; outline: none; font-weight: 700;
    transition: border-color .15s, box-shadow .15s;
  }
  .toolbar select:focus, .toolbar input[type=text]:focus {
    border-color: var(--primary); box-shadow: 0 0 0 4px rgba(253, 188, 180, .4);
  }
  .toolbar input[type=text] { min-width: 240px; flex: 1; max-width: 420px; }
  .toolbar > label {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700;
    color: var(--text-muted); cursor: pointer; user-select: none;
    padding: 7px 14px; border-radius: 999px;
    border: var(--br); background: var(--bg);
    transition: all .15s;
  }
  .toolbar > label:hover { border-color: var(--primary-dark); }
  .toolbar > label:has(input:checked) {
    color: #D9745F; border-color: var(--primary); background: var(--primary-soft);
  }
  .toolbar input[type=checkbox] { accent-color: var(--primary); width: 15px; height: 15px; }
  .toolbar .count {
    margin-left: auto; color: var(--text-muted); font-size: 12.5px; font-weight: 700; white-space: nowrap;
  }
  .toolbar .count b { color: #D9745F; font-weight: 900; }

  /* 列设置 */
  .col-picker { position: relative; }
  .col-picker > button {
    background: var(--bg); color: var(--text); border: var(--br);
    border-radius: 12px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: border-color .15s;
  }
  .col-picker > button:hover { border-color: var(--primary); }
  .col-picker-menu {
    position: absolute; top: calc(100% + 8px); left: 0;
    background: var(--bg); border: var(--br); border-radius: 14px;
    padding: 9px; min-width: 150px; z-index: 30;
    box-shadow: var(--sh-md);
    display: flex; flex-direction: column; gap: 2px;
  }
  .col-picker-menu[hidden] { display: none; }
  .col-picker-menu label {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700;
    color: var(--text-muted); user-select: none;
  }
  .col-picker-menu label:hover { background: var(--primary-soft); color: #D9745F; }
  .col-picker-menu input { accent-color: var(--primary); }

  /* ===== 表格 ===== */
  .table-wrap { margin-top: 24px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: var(--primary-soft); color: var(--text); text-align: left;
    padding: 13px 14px; border-bottom: 3px solid var(--text);
    font-family: "Fredoka", "PingFang SC", sans-serif;
    font-weight: 600; font-size: 12px; white-space: nowrap;
    letter-spacing: .5px;
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) { background: #FBF8F4; }
  tbody tr:hover { background: var(--primary-soft); }

  /* 彩色小标签（pill，无边框，小面积） */
  .tag {
    display: inline-block; padding: 2px 11px; border-radius: 999px;
    font-size: 12px; font-weight: 800; line-height: 1.7; white-space: nowrap;
  }
  .tag-int { background: var(--cta); color: #fff; padding: 3px 13px; font-size: 12.5px; }
  .tag-mag { background: #DDEAF7; color: #1D5E9E; }
  .tag-enrage { background: #FDE9D5; color: #B4530A; }
  .tag-bleed { background: #FADFE1; color: #8E1E36; }
  .tag-poison { background: #F5F1D8; color: #6E7F14; }
  .tag-disease { background: #E4E8D8; color: #4E5F1E; }
  .tag-curse { background: #E9E5F5; color: #533E8F; }
  .tag-boss { background: #8B5CF6; color: #fff; }
  .tag-no { color: #CBD5E1; background: transparent; }
  .desc { color: var(--text-muted); max-width: 520px; line-height: 1.6; }
  .spellname a { color: #C75F4A; font-weight: 800; }
  .spellname a:hover { color: var(--text); }
  .spellname .sid { color: #9AA5B1; font-size: 12px; margin-top: 2px; }
  .dungeon { color: var(--text); font-weight: 800; white-space: nowrap; }
  .mob { white-space: nowrap; font-weight: 800; font-size: 13.5px; }
  .mob .en { color: var(--text-muted); font-size: 12px; font-weight: 400; }

  .empty { padding: 70px 20px; text-align: center; color: var(--text-muted); font-weight: 700; }

  /* ===== 页脚 ===== */
  .site-footer {
    max-width: 1152px; margin: 0 auto; padding: 24px;
    color: var(--text-muted); font-size: 13px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  .site-footer b { color: #C75F4A; }
  .site-footer .right { margin-left: auto; }

  /* ===== 响应式 ===== */
  @media (max-width: 960px) {
    .hero-inner { grid-template-columns: 1fr; gap: 32px; }
    .topnav-links { display: none; }
    .topnav-right { margin-left: auto; }
    .topnav-burger { display: inline-flex; }
    .toolbar input[type=text] { min-width: 0; max-width: none; width: 100%; }
    .toolbar .count { margin-left: 0; }
    .desc { max-width: 300px; }
  }
  @media (max-width: 600px) {
    .hero { padding: 120px 16px 40px; }
    .hero h1 { font-size: 32px; }
    .container { padding: 0 12px 56px; }
    .stats { gap: 12px; }
    .stat { padding: 14px; }
    .stat .num { font-size: 26px; }
    .topnav-name .acc { display: none; }
    .topnav-inner { padding: 8px 12px; gap: 8px; }
    .topnav-right .btn { padding: 7px 12px; }
    .blob { display: none; }
    thead th, tbody td { padding: 9px 11px; font-size: 13px; }
  }
</style>
</head>

<script>
const WOWHEAD_BASE = "https://www.wowhead.com/spell=";
const AUTHOR = "西番芥";

// 列定义：key 对应 CSS class col-xxx，label 是显示名，default 是默认是否显示
const COLUMNS = [
  { key: "dungeon", labelKey: "dungeon", default: true },
  { key: "mob", labelKey: "mob", default: true },
  { key: "spell", labelKey: "spell", default: true },
  { key: "int", labelKey: "int", default: true },
  { key: "mag", labelKey: "mag", default: true },
  { key: "enrage", labelKey: "enrage", default: false },
  { key: "bleed", labelKey: "bleed", default: false },
  { key: "poison", labelKey: "poison", default: false },
  { key: "disease", labelKey: "disease", default: false },
  { key: "curse", labelKey: "curse", default: false },

  { key: "desc", labelKey: "desc", default: true },
];

const COL_STORAGE_KEY = "mss_visible_cols_v1";

function getVisibleCols() {
  try {
    const saved = JSON.parse(localStorage.getItem(COL_STORAGE_KEY) || "null");
    if (saved && typeof saved === "object") return saved;
  } catch (e) { /* fallback to defaults */ }
  const def = {};
  COLUMNS.forEach((c) => { def[c.key] = c.default; });
  return def;
}

function applyColVisibility(visible) {
  COLUMNS.forEach((c) => {
    const cls = "col-" + c.key;
    const show = !!visible[c.key];
    document.querySelectorAll("." + cls).forEach((el) => {
      el.style.display = show ? "" : "none";
    });
  });
}

function renderColPickerMenu() {
  const visible = getVisibleCols();
  const menu = document.getElementById("colPickerMenu");
  menu.innerHTML = COLUMNS.map((c) => (
    '<label><input type="checkbox" data-col="' + c.key + '" ' +
    (visible[c.key] ? "checked" : "") + ' /> ' + t(c.labelKey) + '</label>'
  )).join("");
}

function setupColPicker() {
  renderColPickerMenu();

  const menu = document.getElementById("colPickerMenu");
  const btn = document.getElementById("colPickerBtn");

  menu.addEventListener("change", (e) => {
    if (e.target.tagName !== "INPUT") return;
    const key = e.target.getAttribute("data-col");
    const visible = getVisibleCols();
    visible[key] = e.target.checked;
    localStorage.setItem(COL_STORAGE_KEY, JSON.stringify(visible));
    applyColVisibility(visible);
  });

  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    menu.hidden = !menu.hidden;
  });
  document.addEventListener("click", (e) => {
    if (!menu.hidden && !menu.contains(e.target) && e.target !== btn) {
      menu.hidden = true;
    }
  });

  // 初始应用
  applyColVisibility(getVisibleCols());
}

const state = {
  rows: [],
  seasons: [],
  dungeons: [],
  season: "",
  dungeon: "",
  q: "",
  onlyInterrupt: false,
  onlyMagic: false,
  intCount: 0,
  magCount: 0,
  lang: localStorage.getItem("mss_lang") === "en" ? "en" : "zh",
};

const $ = (s) => document.querySelector(s);

// HTML 转义（输出时防 XSS），用 \uXXXX 避开实体被工具二次解码
const ESC = { "\u0026": "\u0026amp;", "\u003c": "\u0026lt;", "\u003e": "\u0026gt;", "\u0022": "\u0026quot;", "\u0027": "\u0026#39;" };
const escapeHtml = (s) => String(s == null ? "" : s).replace(/[\u0026\u003c\u003e\u0022\u0027]/g, (c) => ESC[c]);

// ===== 中英双语（localStorage 记忆，默认中文） =====
const I18N = {
  zh: {
    dungeon: "副本", mob: "怪物", spell: "技能",
    int: "打断", mag: "魔法", enrage: "激怒", bleed: "流血",
    poison: "中毒", disease: "疾病", curse: "诅咒", desc: "描述",
    tagBoss: "BOSS", tagInt: "可打断", tagMagic: "魔法", tagEnrage: "激怒", tagBleed: "流血",
    tagPoison: "中毒", tagDisease: "疾病", tagCurse: "诅咒", tagNo: "—",
    allSeasons: "全部赛季", allDungeons: "全部副本",
    onlyInterrupt: "仅打断", onlyMagic: "仅可驱散", colPicker: "列设置",
    searchPlaceholder: "搜索 技能名 / 怪物 / 描述…",
    countHit: "命中", countOf: "/ 共", countRows: "条",
    statTotal: "总技能条目", statDungeon: "覆盖副本", statInt: "可打断技能", statMag: "魔法可驱散",
    empty: "没有匹配的技能，换个关键词再试试吧！",
    loading: "加载中…", loadFail: "加载失败",
    navBili: "B站主页", navCta: "副本卡片",
  },
  en: {
    dungeon: "Dungeon", mob: "Mob", spell: "Spell",
    int: "Int", mag: "Magic", enrage: "Enrage", bleed: "Bleed",
    poison: "Poison", disease: "Disease", curse: "Curse", desc: "Description",
    tagBoss: "BOSS", tagInt: "Int", tagMagic: "Magic", tagEnrage: "Enrage", tagBleed: "Bleed",
    tagPoison: "Poison", tagDisease: "Disease", tagCurse: "Curse", tagNo: "—",
    allSeasons: "All Seasons", allDungeons: "All Dungeons",
    onlyInterrupt: "Int only", onlyMagic: "Dispel only", colPicker: "Columns",
    searchPlaceholder: "Search spell / mob / description…",
    countHit: "Matched", countOf: "/", countRows: "rows",
    statTotal: "Total Spells", statDungeon: "Dungeons", statInt: "Interruptible", statMag: "Magic (Dispel)",
    empty: "No matching spells. Try another keyword!",
    loading: "Loading…", loadFail: "Load failed",
    navBili: "Bilibili", navCta: "Dungeon Cards",
  },
};
const t = (k) => (I18N[state.lang] && I18N[state.lang][k]) || I18N.zh[k] || k;

// 静态文案切换（表头/工具栏/统计/列设置），不动数据
function applyStaticLang() {
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  const q = $("#q");
  if (q) q.placeholder = t("searchPlaceholder");
  document.querySelectorAll("#langSwitch button").forEach((b) => {
    b.classList.toggle("active", b.getAttribute("data-lang") === state.lang);
  });
  renderColPickerMenu();
}

// 完整切换：静态文案 + 副本下拉显示名 + 表格数据
function applyLang() {
  applyStaticLang();
  refreshDungeonSelect();
  render();
}

// 副本下拉显示名（选中值始终为中文名，仅显示随语言切换）
function dungeonLabel(d) {
  const en = state.lang === "en";
  const name = en ? (d.en || d.name) : d.name;
  return name + (en ? " (" + d.count + ")" : "（" + d.count + "）");
}

async function load() {
  try {
    const res = await fetch("data.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    state.seasons = Object.keys(data.seasons || {});
    state.dungeons = data.dungeons || [];
    state.rows = (data.rows || []).map((r) => ({
      season: r.season || "",
      dungeonZh: r.dungeonZh || "",
      dungeonEn: r.dungeonEn || "",
      mobZh: r.mobZh || "",
      mobEn: r.mobEn || "",
      npcId: r.npcId || "",
      isBoss: !!r.isBoss,
      spellName: r.spellName || "",
      spellNameEn: r.spellNameEn || "",
      spellId: r.spellId || "",
      description: r.description || "",
      descriptionEn: r.descriptionEn || "",

      interruptible: !!r.interruptible,
      isMagic: !!r.isMagic,
      isEnrage: !!r.isEnrage,
      isBleed: !!r.isBleed,
      isPoison: !!r.isPoison,
      isDisease: !!r.isDisease,
      isCurse: !!r.isCurse,
    }));

    state.intCount = state.rows.filter((r) => r.interruptible).length;
    state.magCount = state.rows.filter((r) => r.isMagic).length;

    // 填赛季下拉
    const sSel = $("#season");
    state.seasons.forEach((s) => {
      const opt = document.createElement("option");
      opt.value = s;
      opt.textContent = s;
      sSel.appendChild(opt);
    });

    // 填副本下拉（联动赛季）
    const dSel = $("#dungeon");
    state.dungeons.forEach((d) => {
      const opt = document.createElement("option");
      opt.value = d.name;
      opt.textContent = dungeonLabel(d);
      dSel.appendChild(opt);
    });

    // 统计卡片
    $("#statTotal").textContent = state.rows.length;
    $("#statDungeon").textContent = state.dungeons.length;
    $("#statInt").textContent = state.intCount;
    $("#statMag").textContent = state.magCount;
    applyLang();
  } catch (err) {
    $("#count").textContent = t("loadFail");
    $("#empty").hidden = false;
    $("#empty").innerHTML = "<div class=\"big\">⚠️</div>加载 data.json 失败：" + escapeHtml(err.message);
  }
}

function render() {
  const q = state.q.trim().toLowerCase();
  const list = state.rows.filter((r) => {
    if (state.season && r.season !== state.season) return false;
    if (state.dungeon && r.dungeonZh !== state.dungeon) return false;
    if (state.onlyInterrupt && !r.interruptible) return false;
    if (state.onlyMagic && !r.isMagic) return false;
    if (q) {
      // 搜索命中中英文任一字段
      const hay = [
        r.spellName, r.spellNameEn, r.mobZh, r.mobEn,
        r.dungeonZh, r.dungeonEn, r.description, r.descriptionEn,
      ].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  // 技能掌握度
  const hit = list.length, total = state.rows.length;

  $("#count").textContent = t("countHit") + " ";
  const b = document.createElement("b");
  b.textContent = hit;
  $("#count").appendChild(b);
  $("#count").append(" " + t("countOf") + " " + total + " " + t("countRows"));

  const tbody = $("#tbody");
  if (!list.length) {
    tbody.innerHTML = "";
    $("#empty").hidden = false;
    $("#empty").innerHTML = "<div class=\"big\">🔍</div>" + escapeHtml(t("empty"));
    return;
  }
  $("#empty").hidden = true;
  const en = state.lang === "en";
  const tagCell = (show, cls, i18nKey) => show
    ? '<span class="tag tag-' + cls + '">' + t(i18nKey) + '</span>'
    : '<span class="tag tag-no">' + t("tagNo") + '</span>';
  tbody.innerHTML = list.map((r) => {
    // 五项减益全 true 视为 MDT 脏数据，隐藏标签（保留原语义）
    const allDebuffs = r.isEnrage && r.isBleed && r.isPoison && r.isDisease && r.isCurse;
    // 中英切换：主名 + 副名（小字）
    const dungeonName = en ? (r.dungeonEn || r.dungeonZh) : r.dungeonZh;
    const mobMain = en ? (r.mobEn || r.mobZh) : r.mobZh;
    const mobSub = en ? r.mobZh : r.mobEn;
    const spellName = en ? (r.spellNameEn || r.spellName) : r.spellName;
    const desc = en ? (r.descriptionEn || r.description) : r.description;
    return "<tr>" +
    "<td class=\"dungeon col-dungeon\">" + escapeHtml(dungeonName) + "</td>" +
    "<td class=\"mob col-mob\">" + (r.isBoss ? "<span class=\"tag tag-boss\">" + t("tagBoss") + "</span> " : "") + escapeHtml(mobMain) + (mobSub ? "<br><span class=\"en\">" + escapeHtml(mobSub) + "</span>" : "") + "</td>" +
    "<td class=\"spellname col-spell\"><a href=\"" + WOWHEAD_BASE + encodeURIComponent(r.spellId) + "\" target=\"_blank\" rel=\"noopener\">" + escapeHtml(spellName) + "</a>" +
    "<div class=\"sid\">ID " + escapeHtml(r.spellId) + "</div></td>" +
    "<td class=\"col-int\">" + tagCell(r.interruptible, "int", "tagInt") + "</td>" +
    "<td class=\"col-mag\">" + tagCell(r.isMagic, "mag", "tagMagic") + "</td>" +
    "<td class=\"col-enrage\">" + tagCell(r.isEnrage && !allDebuffs, "enrage", "tagEnrage") + "</td>" +
    "<td class=\"col-bleed\">" + tagCell(r.isBleed && !allDebuffs, "bleed", "tagBleed") + "</td>" +
    "<td class=\"col-poison\">" + tagCell(r.isPoison && !allDebuffs, "poison", "tagPoison") + "</td>" +
    "<td class=\"col-disease\">" + tagCell(r.isDisease && !allDebuffs, "disease", "tagDisease") + "</td>" +
    "<td class=\"col-curse\">" + tagCell(r.isCurse && !allDebuffs, "curse", "tagCurse") + "</td>" +
    "<td class=\"desc col-desc\">" + escapeHtml(desc || "") + "</td>" +
    "</tr>";
  }).join("");
  // 重新应用列可见性
  applyColVisibility(getVisibleCols());
}

function refreshDungeonSelect() {
  const dSel = $("#dungeon");
  const prev = dSel.value;
  dSel.innerHTML = "<option value=\"\">" + escapeHtml(t("allDungeons")) + "</option>";
  const filtered = state.season
    ? state.dungeons.filter((d) => state.rows.some((r) => r.season === state.season && r.dungeonZh === d.name))
    : state.dungeons;
  filtered.forEach((d) => {
    const opt = document.createElement("option");
    opt.value = d.name;
    opt.textContent = dungeonLabel(d);
    dSel.appendChild(opt);
  });
  // 尝试恢复之前选中的副本
  if (prev && [...dSel.options].some((o) => o.value === prev)) dSel.value = prev;
  else state.dungeon = "";
}

function bindEvents() {
  $("#season").addEventListener("change", (e) => { state.season = e.target.value; refreshDungeonSelect(); render(); });
  $("#dungeon").addEventListener("change", (e) => { state.dungeon = e.target.value; render(); });
  $("#q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
  $("#onlyInterrupt").addEventListener("change", (e) => { state.onlyInterrupt = e.target.checked; render(); });
  $("#onlyMagic").addEventListener("change", (e) => { state.onlyMagic = e.target.checked; render(); });
  // 中英切换（导航 + 移动端菜单）
  document.querySelectorAll("#langSwitch button").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.lang = btn.getAttribute("data-lang") === "en" ? "en" : "zh";
      localStorage.setItem("mss_lang", state.lang);
      applyLang();
    });
  });
}

bindEvents();
setupColPicker();
// 移动端导航菜单
(function () {
  const burger = $("#topnavBurger"), menu = $("#topnavMenu");
  if (!burger || !menu) return;
  burger.addEventListener("click", () => {
    const open = menu.classList.toggle("open");
    burger.setAttribute("aria-expanded", open ? "true" : "false");
  });
  menu.querySelectorAll("a").forEach((a) =>
    a.addEventListener("click", () => {
      menu.classList.remove("open");
      burger.setAttribute("aria-expanded", "false");
    })
  );
})();
applyStaticLang();  // 先应用 localStorage 记忆的语言（数据加载前静态文案即可切换）
load();
</script>
</body>
</html>
