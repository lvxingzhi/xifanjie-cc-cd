name: Build & Update

# 纯手动触发：不随 push、不按定时。新赛季/PTR 或想刷新数据时，在 Actions 页面手动 Run。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'MDT 分支（master=正式服, ptr12.1=PTR 测试服）'
        type: string
        default: 'master'

permissions:
  contents: write    # 回写 data.json + data/（技能缓存）

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 构建数据（定向拉取 MDT，仅所需文件，全量重拉 Wowhead 技能描述，失败回退缓存）
        run: |
          python -m mdt_site --branch "${{ inputs.branch }}" --fetch

      - name: 回写数据（data.json + 技能缓存）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data/
          if git diff --cached --quiet; then
            echo "::notice::数据无变化，无需回写"
          else
            git commit -m "chore: 更新站点数据 [skip ci]"
            git push
          fi
